<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
@font-face{font-family:"DejaVuSub";src:url(__FONT__) format("truetype");font-weight:700}
:root{--bg:#f3efe6;--panel:#fffdf8;--ink:#23211c;--mute:#6f6a5f;--line:#d9d2c2;--accent:#2f8a4e;--accent-ink:#fff;--bar:#e6e0d2;--warn:#b3541e;
  --mono:ui-monospace,"Cascadia Mono","Consolas","SFMono-Regular",monospace;--sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#121512;--panel:#1b1f1b;--ink:#e9efe6;--mute:#93a08f;--line:#2e362d;--accent:#5fd38a;--accent-ink:#0d150f;--bar:#262d25;--warn:#f0a065;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans)}
main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:28px;max-width:1100px;margin:0 auto;padding:28px 20px}
@media (max-width:760px){main{grid-template-columns:1fr}}
h1{font:600 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
h2{font-size:24px;line-height:1.15;margin:0 0 18px;font-weight:650}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--ink);padding:8px 6px;font:14px var(--sans);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hint{font-size:13px;color:var(--mute);margin:6px 0 0}
#go{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 16px var(--sans);cursor:pointer}
#go:disabled{opacity:.5;cursor:wait}
.bar{height:8px;background:var(--bar);border-radius:4px;overflow:hidden;margin:16px 0 8px}.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:14px}dt{color:var(--mute)}dd{margin:0;font-family:var(--mono);font-size:13px;word-break:break-word}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.frame{height:min(78vh,720px);aspect-ratio:9/16;background:#000;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.frame canvas,.frame video{width:100%;height:100%;display:block;object-fit:contain}
#msg{font-size:14px;min-height:1.5em}#msg.err{color:var(--warn)}
.dl{display:none;gap:10px;flex-wrap:wrap;justify-content:center}.dl a{padding:9px 14px;border:1px solid var(--accent);border-radius:8px;color:var(--accent);text-decoration:none;font-weight:600}
</style></head>
<body><main>
<section>
  <h1>Kos Melati · render</h1>
  <h2>__HEADING__</h2>
  <div class="panel">
    <label>Frame per detik</label>
    <div class="seg" data-k="fps"><button data-v="24" aria-pressed="true">24</button><button data-v="30">30</button></div>
    <label>Gaya gerak</label>
    <div class="seg" data-k="style"><button data-v="smooth" aria-pressed="true">Halus</button><button data-v="stop">Stop-motion</button></div>
    <label>Resolusi</label>
    <div class="seg" data-k="res"><button data-v="1080" aria-pressed="true">1080×1920</button><button data-v="540">540×960</button></div>
    <button id="go" disabled>Memuat aset…</button>
    <div class="bar"><i id="prog"></i></div>
    <div id="msg"></div>
    <dl>
      <dt>GPU</dt><dd id="gpu">–</dd>
      <dt>Video</dt><dd id="enc">–</dd>
      <dt>Audio</dt><dd id="aenc">–</dd>
      <dt>Frame</dt><dd id="st_f">–</dd>
      <dt>Rata-rata</dt><dd id="st_ms">–</dd>
      <dt>Total</dt><dd id="st_t">–</dd>
      <dt>Estimasi episode 190 dtk</dt><dd id="st_ep">–</dd>
    </dl>
  </div>
</section>
<section class="stage"><div class="frame" id="frame"></div><div class="dl" id="dl"></div></section>
</main>

  lines.forEach((ln,i)=>{ctx.strokeText(ln,W/2,y0+i*lh);ctx.fillText(ln,W/2,y0+i*lh);}); }
function composite(t){ const W=out.width,H=out.height;
  const fb=K.flash.some(([a,b])=>t>=a&&t<b); octx.filter=fb?'saturate(0.2) brightness(0.92)':'none'; octx.drawImage(r.domElement,0,0,W,H); octx.filter='none';
  for(const s of K.subs) if(t>=s.t0&&t<s.t1) text(octx,W,H,s.text,0.30,68);
  if(K.end&&t>=K.end.t0){ octx.fillStyle='#000'; octx.fillRect(0,0,W,H); text(octx,W,H,K.end.text,0.5,96); } }
function setRes(w){ const h=Math.round(w*16/9/2)*2; r.setSize(w,h,false); out.width=w; out.height=h; cam.aspect=w/h; return [w,h]; }
setRes(540); setStyle('smooth'); pose(K.preview,'smooth'); r.render(scene,cam); composite(K.preview);
// ---------- audio
let audioBuf=null;
if(K.audio){ const ab=await (await fetch(K.audio)).arrayBuffer(); audioBuf=await new OfflineAudioContext(2,48000,48000).decodeAudioData(ab); }
$('go').disabled=false; $('go').textContent='Mulai render'; say('Aset siap. Biarkan tab ini tetap terbuka dan terlihat selama render.');
async function pickVideo(w,h,fps){ const bitrate=Math.round(w*h*fps*0.25);
  for(const hw of ['prefer-hardware','no-preference']) for(const [codec,kind] of [['avc1.640028','avc'],['avc1.4d0028','avc'],['avc1.640033','avc'],['vp09.00.40.08','vp9']]){
    const cfg={codec,width:w,height:h,bitrate,framerate:fps,hardwareAcceleration:hw,latencyMode:'quality'}; if(kind==='avc') cfg.avc={format:'avc'};
    try{ if((await VideoEncoder.isConfigSupported(cfg)).supported) return {cfg,kind,hw}; }catch(e){} }
  throw new Error('Tidak ada codec video yang didukung.'); }
async function pickAudio(sr,ch){ for(const [codec,kind] of [['mp4a.40.2','aac'],['opus','opus']]){ const cfg={codec,sampleRate:sr,numberOfChannels:ch,bitrate:192000};
    try{ if((await AudioEncoder.isConfigSupported(cfg)).supported) return {cfg,kind}; }catch(e){} } return null; }
const fmt=s=>s<60?`${s.toFixed(1)} dtk`:s<3600?`${Math.floor(s/60)} mnt ${Math.round(s%60)} dtk`:`${Math.floor(s/3600)} jam ${Math.round(s%3600/60)} mnt`;
$('go').onclick=async()=>{
  $('go').disabled=true; $('dl').style.display='none'; const old=$('frame').querySelector('video'); if(old){old.remove(); out.style.display='';}
  try{
    const {fps,style,res}=opt, [w,h]=setRes(res), DUR=K.duration, N=Math.round(DUR*fps); setStyle(style);
    const V=await pickVideo(w,h,fps), A=audioBuf?await pickAudio(audioBuf.sampleRate,audioBuf.numberOfChannels):null;
    $('enc').textContent=`${V.cfg.codec} · ${V.hw==='prefer-hardware'?'hardware':'otomatis'} · ${(V.cfg.bitrate/1e6).toFixed(1)} Mbps`;
    $('aenc').textContent=A?`${A.cfg.codec} · 192 kbps`:'tidak ada';
    const muxer=new Muxer({target:new ArrayBufferTarget(),video:{codec:V.kind,width:w,height:h,frameRate:fps},
      audio:A?{codec:A.kind,numberOfChannels:audioBuf.numberOfChannels,sampleRate:audioBuf.sampleRate}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
    let err=null; const enc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>err=e}); enc.configure(V.cfg);
    const t0=performance.now(); let tR=0;
    for(let i=0;i<N;i++){ if(err) throw err; const t=i/fps, a=performance.now();
      pose(t,style); r.render(scene,cam); composite(t); tR+=performance.now()-a;
      const vf=new VideoFrame(out,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)}); enc.encode(vf,{keyFrame:i%(fps*2)===0}); vf.close();
      while(enc.encodeQueueSize>4) await new Promise(q=>setTimeout(q,1));
      if(i%4===0||i===N-1){ $('prog').style.width=`${(i+1)/N*100}%`; $('st_f').textContent=`${i+1} / ${N}`; await new Promise(q=>setTimeout(q,0)); } }
    await enc.flush(); enc.close();
    if(A){ let aerr=null; const ae=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>aerr=e}); ae.configure(A.cfg);
      const sr=audioBuf.sampleRate, ch=audioBuf.numberOfChannels, len=Math.min(audioBuf.length,Math.round(DUR*sr)), B=1024;
      for(let s=0;s<len;s+=B){ const n=Math.min(B,len-s), d=new Float32Array(n*ch); for(let c=0;c<ch;c++) d.set(audioBuf.getChannelData(c).subarray(s,s+n),c*n);
        const ad=new AudioData({format:'f32-planar',sampleRate:sr,numberOfFrames:n,numberOfChannels:ch,timestamp:Math.round(s/sr*1e6),data:d}); ae.encode(ad); ad.close();
        if(aerr) throw aerr; if(ae.encodeQueueSize>16) await new Promise(q=>setTimeout(q,0)); }
      await ae.flush(); ae.close(); }
    muxer.finalize();
    const total=(performance.now()-t0)/1000, per=total/N;
    $('st_ms').textContent=`${(per*1000).toFixed(0)} ms/frame (gambar ${(tR/N).toFixed(0)} ms)`; $('st_t').textContent=`${fmt(total)} untuk ${N} frame`; $('st_ep').textContent=`${fmt(per*190*fps)} (${190*fps} frame)`;
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'}), url=URL.createObjectURL(blob), name=`${K.slug}_${fps}fps_${style}_${h}p.mp4`;
    const v=document.createElement('video'); v.src=url; v.controls=v.loop=true; v.playsInline=true; out.style.display='none'; $('frame').appendChild(v);
    const stats=`GPU: ${$('gpu').textContent}\nVideo: ${$('enc').textContent}\nAudio: ${$('aenc').textContent}\nResolusi: ${w}x${h}, ${fps} fps, gaya ${style}\nFrame: ${N}\nRata-rata: ${$('st_ms').textContent}\nTotal: ${$('st_t').textContent}\nEstimasi episode 190 dtk: ${$('st_ep').textContent}\nUkuran MP4: ${(blob.size/1e6).toFixed(2)} MB\n`;
    $('dl').innerHTML=`<a href="${url}" download="${name}">Unduh MP4 (${(blob.size/1e6).toFixed(1)} MB)</a><a href="${URL.createObjectURL(new Blob([stats],{type:'text/plain'}))}" download="${name.replace('.mp4','_statistik.txt')}">Unduh statistik</a>`;
    $('dl').style.display='flex'; say('Selesai. Putar videonya di samping, lalu unduh MP4 dan statistiknya.');
    window.__result={size:blob.size,total,per,codec:V.cfg.codec,audio:A&&A.cfg.codec};
  }catch(e){ console.error(e); say('Gagal: '+(e.message||e),true); window.__result={error:String(e)}; }
  $('go').disabled=false; $('go').textContent='Render lagi';
};
window.__snap=(t,w)=>{ setRes(w||540); setStyle('smooth'); pose(t,'smooth'); r.render(scene,cam); composite(t); return out.toDataURL('image/png'); };
window.__ready=true;
</script></body></html>
